# Sunrise Dental - business settings (non-secret). DB credentials come from environment variables.

# ---- clinic profile (printed on receipts) ----
clinic.name=Sunrise Dental Clinic
clinic.address=12 Main Street
clinic.phone=0112345678
clinic.currency=LKR
# Days the clinic works (used for dentist utilisation): MON,TUE,WED,THU,FRI,SAT,SUN
clinic.working.days=MON,TUE,WED,THU,FRI,SAT

# ---- billing ----
# Consultation fee added to every bill ...
clinic.consultation.fee=25.00
# ... except bills of this treatment, which already is the consultation (blank = never waive)
clinic.consultation.treatment.code=CHK

# Tax percentage applied by every billing strategy, on the discounted amount
billing.tax.percent=0.00

# Senior discount strategy
billing.senior.discount.percent=15.00
billing.senior.min.age=60

# Insurance strategy: share paid by the insurer when the request does not state one
billing.insurance.default.coverage.percent=70.00

# Files written to the receipts folder (SUNRISE_RECEIPTS_DIR, default ./receipts): txt, html
receipts.formats=txt,html

# ---- reminders ----
reminders.enabled=true
# Daily run time (24h, server time zone); sends reminders for the NEXT day
reminders.run.time=18:00
